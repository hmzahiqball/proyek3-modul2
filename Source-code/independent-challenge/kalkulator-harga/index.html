<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport"
    content="width=device-width, initial-scale=1">
    <title>Independent Challenge - Kalkulator Harga</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container">
        <section class="praktikum-card"
        aria-labelledby="judul-utama">
        <p class="label">Independent Challenge C1</p>
        <h1 id="judul-utama">Kalkulator Harga</h1>
        <form id="form-hitung">
            <label for="harga">Harga</label>
            <input id="harga" name="harga" type="number" required>
            
            <label for="jumlah">Jumlah</label>
            <input id="jumlah" name="jumlah" type="number" required>
            
            <div class="checkbox-group">
                <input id="anggota" name="anggota" type="checkbox">
                <label for="anggota">Anggota Koperasi / Member</label>
            </div>

            <button id="hitung" type="submit">Hitung</button>
        </form>
        <p>Total Akhir: Rp <output id="hasil">0</output></p>
        <p id="pesan" role="status" aria-live="polite">
        Masukkan harga dan jumlah.
        </p>
    </section>
    </main>
    <script src="js/app.js" defer></script>
</body>
</html>
