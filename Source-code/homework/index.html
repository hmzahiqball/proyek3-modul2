<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Profile Card</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="light-theme">
  <div class="theme-toggle-container">
    <button id="themeToggle">Toggle Theme</button>
  </div>

  <div id="app" class="card-container">
    <div id="state-container">
      <!-- Loading, Empty, Error states will be injected here -->
    </div>
    
    <div id="profile-content" class="hidden">
      <div class="profile-header">
        <h1 id="profile-name"></h1>
        <h2 id="profile-title"></h2>
      </div>
      
      <button id="detail-toggle" aria-expanded="false">Show Details</button>
      
      <div id="profile-details" class="details-section hidden">
        <p id="profile-bio"></p>
      </div>

      <div class="skills-section">
        <h3>Skills</h3>
        <form id="skill-form">
          <input type="text" id="skill-input" placeholder="Add a new skill">
          <button type="submit">Add</button>
        </form>
        <div id="skill-error" class="error-msg hidden">Please enter a valid skill.</div>
        
        <ul id="skill-list">
          <!-- Skills injected here -->
        </ul>
        <div id="empty-skills-msg" class="hidden">No skills available. Add some!</div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
